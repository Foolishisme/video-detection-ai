<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能监控系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            width: 100vw;
            height: 100vh;
            gap: 2px;
            background-color: #000;
        }

        .video-cell {
            position: relative;
            background-color: #000;
            overflow: hidden;
        }

        .video-cell img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #000;
        }

        .alert-count-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            z-index: 10;
        }

        .window-warning {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background-color: rgba(255, 193, 7, 0.8);
            color: #000;
            padding: 12px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            z-index: 20;
            display: none;
        }

        .window-warning.show {
            display: block;
        }

        .fullscreen-popup {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(220, 20, 60, 0.95);
            color: #fff;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
        }

        .fullscreen-popup.show {
            display: flex;
        }

        .fullscreen-popup-content {
            text-align: center;
            padding: 40px;
        }

        .fullscreen-popup h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .fullscreen-popup .alert-type {
            font-size: 36px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .fullscreen-popup .alert-message {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .fullscreen-popup .alert-time {
            font-size: 18px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="grid-container" id="gridContainer">
        <!-- 9个视频格子，动态生成 -->
    </div>

    <!-- 全屏危险弹窗 -->
    <div class="fullscreen-popup" id="fullscreenPopup">
        <div class="fullscreen-popup-content">
            <h1>⚠️ 危险告警</h1>
            <div class="alert-type" id="popupAlertType"></div>
            <div class="alert-message" id="popupAlertMessage"></div>
            <div class="alert-time" id="popupAlertTime"></div>
        </div>
    </div>

    <script>
        const MAX_SOURCES = 9;
        let sourceCount = 0;
        let lastAlertIds = new Set(); // 用于跟踪已处理的告警
        let windowWarnings = {}; // 存储每个视频窗口的警告信息

        // 初始化网格
        async function initGrid() {
            try {
                const response = await fetch('/api/sources');
                const data = await response.json();
                sourceCount = data.source_count || 0;
                
                const gridContainer = document.getElementById('gridContainer');
                gridContainer.innerHTML = '';
                
                // 创建9个格子
                for (let i = 0; i < MAX_SOURCES; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'video-cell';
                    cell.id = `cell-${i}`;
                    
                    if (i < sourceCount) {
                        // 有视频源，显示视频流
                        const img = document.createElement('img');
                        img.src = `/api/video_feed/${i}`;
                        img.alt = `视频源 ${i}`;
                        cell.appendChild(img);
                        
                        // 告警次数覆盖层
                        const alertCountOverlay = document.createElement('div');
                        alertCountOverlay.className = 'alert-count-overlay';
                        alertCountOverlay.id = `alertCount-${i}`;
                        alertCountOverlay.textContent = '告警: 0';
                        cell.appendChild(alertCountOverlay);
                        
                        // 窗口警告覆盖层
                        const windowWarning = document.createElement('div');
                        windowWarning.className = 'window-warning';
                        windowWarning.id = `windowWarning-${i}`;
                        cell.appendChild(windowWarning);
                    } else {
                        // 无视频源，显示黑屏
                        cell.style.backgroundColor = '#000';
                    }
                    
                    gridContainer.appendChild(cell);
                }
            } catch (error) {
                console.error('初始化网格失败:', error);
            }
        }

        // 更新告警次数
        async function updateAlertCounts() {
            for (let i = 0; i < sourceCount; i++) {
                try {
                    const response = await fetch(`/api/status/${i}`);
                    const status = await response.json();
                    
                    if (status.error) {
                        continue;
                    }
                    
                    const alertCountElement = document.getElementById(`alertCount-${i}`);
                    if (alertCountElement) {
                        alertCountElement.textContent = `告警: ${status.alert_count || 0}`;
                    }
                } catch (error) {
                    console.error(`更新视频源 ${i} 告警次数失败:`, error);
                }
            }
        }

        // 监听新告警
        async function checkNewAlerts() {
            try {
                const response = await fetch('/api/alerts');
                const data = await response.json();
                const alerts = data.alerts || [];
                
                // 检查新告警
                for (const alert of alerts) {
                    const alertId = alert.id;
                    
                    // 如果已经处理过，跳过
                    if (lastAlertIds.has(alertId)) {
                        continue;
                    }
                    
                    lastAlertIds.add(alertId);
                    
                    // 只保留最近100个告警ID
                    if (lastAlertIds.size > 100) {
                        const idsArray = Array.from(lastAlertIds);
                        lastAlertIds = new Set(idsArray.slice(-100));
                    }
                    
                    const sourceId = alert.source_id !== undefined ? alert.source_id : 0;
                    const severity = alert.severity || 'safe';
                    const isDanger = alert.is_danger || false;
                    
                    // 危险动作：全屏弹窗
                    if (severity === 'high' && isDanger) {
                        showFullscreenPopup(alert);
                    }
                    // 提醒类：小窗口警告
                    else if (severity === 'low') {
                        showWindowWarning(sourceId, alert);
                    }
                }
            } catch (error) {
                console.error('检查新告警失败:', error);
            }
        }

        // 显示全屏危险弹窗
        function showFullscreenPopup(alert) {
            const popup = document.getElementById('fullscreenPopup');
            const alertType = document.getElementById('popupAlertType');
            const alertMessage = document.getElementById('popupAlertMessage');
            const alertTime = document.getElementById('popupAlertTime');
            
            alertType.textContent = alert.type || '危险';
            alertMessage.textContent = alert.message || '检测到危险情况';
            alertTime.textContent = `时间: ${alert.timestamp || ''}`;
            
            popup.classList.add('show');
            
            // 5秒后自动关闭
            setTimeout(() => {
                popup.classList.remove('show');
            }, 5000);
        }

        // 显示小窗口警告
        function showWindowWarning(sourceId, alert) {
            const warningElement = document.getElementById(`windowWarning-${sourceId}`);
            if (!warningElement) {
                return;
            }
            
            warningElement.textContent = `${alert.type || '提醒'}: ${alert.message || ''}`;
            warningElement.classList.add('show');
            
            // 存储警告信息
            windowWarnings[sourceId] = {
                type: alert.type,
                message: alert.message,
                timestamp: alert.timestamp
            };
            
            // 10秒后自动隐藏（或直到新的告警覆盖）
            setTimeout(() => {
                if (windowWarnings[sourceId] && 
                    windowWarnings[sourceId].timestamp === alert.timestamp) {
                    warningElement.classList.remove('show');
                    delete windowWarnings[sourceId];
                }
            }, 10000);
        }

        // 初始化
        initGrid();

        // 定时更新
        setInterval(updateAlertCounts, 2000); // 每2秒更新告警次数
        setInterval(checkNewAlerts, 1000); // 每1秒检查新告警
    </script>
</body>
</html>
